<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paco — Syntra</title>
<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f5f7;--blanco:#fff;--texto:#1d1d1f;--suave:#6e6e73;--borde:#d2d2d7;
  --verde:#1d6f42;--vc:#e8f5ee;--azul:#0066cc;--ac:#e8f0fb;
  --rojo:#c0392b;--rc:#fdecea;--sol:#f5a623;--sc:#fdf3e0;--gris:#8e8e93;
  --morado:#6b21a8;--mc:#f3e8ff;
}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--texto);min-height:100vh;-webkit-font-smoothing:antialiased}
/* NAV */
nav{background:rgba(245,245,247,.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--borde);height:52px;padding:0 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.logo{font-size:16px;font-weight:600;letter-spacing:4px}
.conn{font-size:12px;font-weight:500;color:var(--suave)}
.conn.ok{color:#34c759}
/* TABS */
.tabs{display:flex;border-bottom:1px solid var(--borde);background:var(--blanco);padding:0 24px}
.tab{padding:12px 16px;font-size:13px;font-weight:500;color:var(--suave);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--texto);border-bottom-color:var(--texto)}
/* WRAP */
.wrap{max-width:1080px;margin:0 auto;padding:20px 24px}
/* BUTTONS */
.btn{padding:8px 16px;border-radius:10px;font-size:13px;font-weight:500;cursor:pointer;border:none;font-family:inherit;transition:.15s all}
.btn-p{background:var(--verde);color:#fff}.btn-p:hover{background:#155c33}
.btn-s{background:transparent;color:var(--texto);border:1px solid var(--borde)}.btn-s:hover{background:var(--bg)}
.btn-r{background:var(--rc);color:var(--rojo);border:1px solid var(--rojo)}.btn-r:hover{background:#f5c6c2}
.btn-sm{padding:5px 12px;font-size:12px}
/* BADGES */
.badge{font-size:11px;font-weight:500;padding:3px 8px;border-radius:6px;display:inline-block}
.b-inst{background:var(--vc);color:var(--verde)}
.b-mant{background:var(--ac);color:var(--azul)}
.b-corr{background:var(--rc);color:var(--rojo)}
.b-bloq{background:var(--bg);color:var(--gris);border:1px solid var(--borde)}
.b-lev{background:var(--mc);color:var(--morado)}
.b-pend{background:var(--sc);color:#8b5e00}
.b-proc{background:var(--ac);color:var(--azul)}
.b-comp{background:var(--vc);color:var(--verde)}
/* CALENDARIO */
.cal-nav{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.cal-mes{font-size:20px;font-weight:300;min-width:180px}
.nav-btn{width:32px;height:32px;border-radius:50%;border:1px solid var(--borde);background:var(--blanco);cursor:pointer;font-size:18px;line-height:1;display:flex;align-items:center;justify-content:center}
.nav-btn:hover{background:var(--bg)}
.grid-dias{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--borde);border-radius:14px;overflow:hidden;margin-bottom:20px}
.cal-lbl{background:var(--bg);padding:8px 4px;text-align:center;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--suave)}
.cal-dia{background:var(--blanco);min-height:90px;padding:8px;cursor:pointer;transition:.1s background}
.cal-dia:hover{background:#fafafa}
.cal-dia.hoy{background:#f0f7ff}
.cal-dia.otro-mes{background:var(--bg)}
.dia-num{font-size:13px;font-weight:400;margin-bottom:6px;color:var(--suave)}
.cal-dia.hoy .dia-num{font-weight:700;color:var(--azul)}
.ev{border-radius:5px;padding:3px 6px;font-size:10px;font-weight:500;color:#fff;margin-bottom:3px;cursor:pointer;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ev-inst{background:var(--verde)}.ev-mant{background:var(--azul)}.ev-corr{background:var(--rojo)}.ev-bloq{background:var(--gris)}.ev-lev{background:var(--morado)}
/* CARDS */
.card{background:var(--blanco);border-radius:14px;border:1px solid var(--borde);padding:16px 18px;margin-bottom:10px;transition:.15s all}
.card:hover{border-color:#b5b5ba;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.card-hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.card-tit{font-size:15px;font-weight:500}
.card-meta{font-size:12px;color:var(--suave);margin-bottom:8px;display:flex;gap:12px;flex-wrap:wrap}
.card-tags{display:flex;gap:6px;flex-wrap:wrap}
.acciones{display:flex;gap:6px;flex-wrap:wrap}
/* EQUIPO */
.av{width:36px;height:36px;border-radius:50%;background:var(--vc);border:2px solid var(--verde);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:var(--verde);flex-shrink:0}
.trabajador-row{display:flex;align-items:center;gap:12px;background:var(--blanco);border:1px solid var(--borde);border-radius:12px;padding:12px 16px;margin-bottom:8px}
.t-info{flex:1}
.t-nombre{font-size:14px;font-weight:500}
.t-rol{font-size:12px;color:var(--suave);margin-top:2px}
.pill{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:500}
.pill-g{background:var(--vc);border:1px solid var(--verde);color:var(--verde)}
/* MODAL */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px)}
.overlay.open{display:flex}
.modal{background:var(--blanco);border-radius:20px 20px 0 0;width:100%;max-width:520px;max-height:88vh;overflow-y:auto}
.m-hdr{padding:18px 22px;border-bottom:1px solid var(--borde);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--blanco);z-index:1}
.m-tit{font-size:17px;font-weight:600}
.m-x{width:28px;height:28px;border-radius:50%;background:var(--bg);border:none;cursor:pointer;font-size:14px;color:var(--suave)}
.m-body{padding:20px 22px}
.m-ftr{padding:14px 22px;border-top:1px solid var(--borde);display:flex;justify-content:flex-end;gap:8px;position:sticky;bottom:0;background:var(--blanco)}
/* FORM */
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fc{display:flex;flex-direction:column;gap:5px}
.fc.full{grid-column:1/-1}
.fc label{font-size:12px;font-weight:500;color:var(--suave)}
.fc input,.fc select,.fc textarea{padding:10px 12px;border:1px solid var(--borde);border-radius:10px;font-size:14px;font-family:inherit;background:var(--bg);outline:none;color:var(--texto);width:100%}
.fc input:focus,.fc select:focus,.fc textarea:focus{border-color:var(--azul);background:var(--blanco)}
.fc textarea{resize:vertical;min-height:64px}
/* CHIPS trabajadores */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{padding:5px 12px;border-radius:20px;border:1px solid var(--borde);font-size:12px;font-weight:500;cursor:pointer;background:var(--bg);color:var(--texto);transition:.1s all}
.chip.on{background:var(--vc);border-color:var(--verde);color:var(--verde)}
/* TOAST */
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.85);color:#fff;padding:11px 22px;border-radius:20px;font-size:14px;z-index:999;display:none}
.toast.show{display:block}
.empty{text-align:center;padding:40px 20px;color:var(--suave);font-size:13px}
.sep{width:1px;height:16px;background:var(--borde);display:inline-block;margin:0 10px;vertical-align:middle}
/* PENDIENTES badge */
.pending-count{background:var(--rojo);color:#fff;border-radius:10px;font-size:10px;font-weight:600;padding:1px 6px;margin-left:6px;vertical-align:middle}
@media(max-width:680px){.fg{grid-template-columns:1fr}.grid-dias{grid-template-columns:repeat(7,1fr)}.cal-dia{min-height:64px}}
</style>
</head>
<body>

<nav>
  <div style="display:flex;align-items:center;gap:10px">
    <div class="logo">SYNTRA</div>
    <span style="color:var(--borde)">|</span>
    <span style="font-size:13px;color:var(--suave)">Operaciones</span>
  </div>
  <span class="conn" id="conn">● Conectando…</span>
</nav>

<div class="tabs">
  <div class="tab on" onclick="tab('cal',this)">Calendario</div>
  <div class="tab" onclick="tab('trabajos',this)">Trabajos <span class="pending-count" id="cnt-pend" style="display:none"></span></div>
  <div class="tab" onclick="tab('equipo',this)">Equipo</div>
</div>

<!-- ═══ CALENDARIO ═══ -->
<div id="v-cal" class="wrap">
  <div class="cal-nav">
    <button class="nav-btn" onclick="mes(-1)">‹</button>
    <div class="cal-mes" id="cal-mes"></div>
    <button class="nav-btn" onclick="mes(1)">›</button>
    <button class="btn btn-s btn-sm" onclick="mesHoy()">Hoy</button>
    <div style="flex:1"></div>
    <button class="btn btn-p btn-sm" onclick="abrirNuevo()">+ Nuevo trabajo</button>
  </div>
  <div class="grid-dias" id="grid-dias">
    <div class="cal-lbl">Lun</div><div class="cal-lbl">Mar</div><div class="cal-lbl">Mié</div>
    <div class="cal-lbl">Jue</div><div class="cal-lbl">Vie</div><div class="cal-lbl">Sáb</div>
    <div class="cal-lbl">Dom</div>
  </div>
</div>

<!-- ═══ TRABAJOS ═══ -->
<div id="v-trabajos" class="wrap" style="display:none">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px">
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <select id="f-tipo" onchange="renderTrabajos()" style="padding:7px 12px;border:1px solid var(--borde);border-radius:10px;font-size:13px;font-family:inherit;background:var(--bg)">
        <option value="">Todos los tipos</option>
        <option value="instalacion">Instalación</option>
        <option value="mantenimiento">Mantenimiento</option>
        <option value="correccion">Corrección</option>
        <option value="bloqueo">Bloqueo</option>
        <option value="levantamiento">Levantamiento</option>
      </select>
      <select id="f-estado" onchange="renderTrabajos()" style="padding:7px 12px;border:1px solid var(--borde);border-radius:10px;font-size:13px;font-family:inherit;background:var(--bg)">
        <option value="">Todos los estados</option>
        <option value="pendiente">Pendiente</option>
        <option value="en_proceso">En proceso</option>
        <option value="completado">Completado</option>

    <button class="btn btn-p btn-sm" onclick="abrirNuevo()">+ Nuevo trabajo</button>
  </div>
  <div id="lista-trabajos"></div>
</div>

<!-- ═══ EQUIPO ═══ -->
<div id="v-equipo" class="wrap" style="display:none">
  <div style="display:flex;justify-content:flex-end;margin-bottom:16px">
    <button class="btn btn-p btn-sm" onclick="abrirNuevoTrabajador()">+ Agregar trabajador</button>
  </div>
  <div id="lista-equipo"></div>
</div>

<!-- MODAL: TRABAJO -->
<div class="overlay" id="m-trabajo">
  <div class="modal">
    <div class="m-hdr">
      <div class="m-tit" id="mt-tit">Nuevo trabajo</div>
      <button class="m-x" onclick="cerrar('m-trabajo')">✕</button>
    </div>
    <div class="m-body">
      <div class="fg">
        <div class="fc full"><label>Título *</label><input id="t-titulo" placeholder="Ej. Instalación Casa López"></div>
        <div class="fc"><label>Tipo *</label>
          <select id="t-tipo" onchange="toggleTecnico()">
            <option value="instalacion">Instalación</option>
            <option value="mantenimiento">Mantenimiento</option>
            <option value="correccion">Corrección de falla</option>
            <option value="bloqueo">Bloqueo / Vacaciones</option>
            <option value="levantamiento">Levantamiento</option>
          </select>
        </div>
        <div class="fc"><label>Estado</label>
          <select id="t-estado">
            <option value="pendiente">Pendiente</option>
            <option value="en_proceso">En proceso</option>
            <option value="completado">Completado</option>
          </select>
        </div>
        <div class="fc"><label>Fecha inicio *</label><input type="date" id="t-fi"></div>
        <div class="fc"><label>Fecha fin</label><input type="date" id="t-ff"></div>
        <div class="fc full"><label>Cliente / Dirección</label><input id="t-cliente" placeholder="Nombre y ubicación"></div>
        <div class="fc full" id="bloque-tecnico" style="display:none">
          <div class="fg" style="margin-bottom:0">
            <div class="fc"><label>Cantidad de paneles</label><input type="number" id="t-paneles" placeholder="Ej. 12" min="1"></div>
            <div class="fc"><label>Potencia por panel (W)</label><input type="number" id="t-panel-w" placeholder="Ej. 550" min="1"></div>
            <div class="fc"><label>Cantidad de inversores</label><input type="number" id="t-inv-cant" placeholder="Ej. 1" min="1"></div>
            <div class="fc"><label>Capacidad inversor (kW)</label><input id="t-inversor" placeholder="Ej. 5k, 6k, 10k…"></div>
            <div class="fc"><label>Cantidad de baterías</label><input type="number" id="t-bat-cant" placeholder="Ej. 2" min="1"></div>
            <div class="fc"><label>Modelo / capacidad batería</label><input id="t-bateria" placeholder="Ej. Luxpower 5.1kWh"></div>
          </div>
        </div>
        <div class="fc full"><label>Equipo asignado</label><div class="chips" id="chips-trab"></div></div>
        <div class="fc full"><label>Notas</label><textarea id="t-notas" placeholder="Observaciones…"></textarea></div>
      </div>
    </div>
    <div class="m-ftr" id="mt-ftr">
      <button class="btn btn-s" onclick="cerrar('m-trabajo')">Cancelar</button>
      <button class="btn btn-p" onclick="guardarTrabajo()">Guardar</button>
    </div>
  </div>
</div>

<!-- MODAL: DETALLE TRABAJO -->
<div class="overlay" id="m-detalle">
  <div class="modal">
    <div class="m-hdr">
      <div class="m-tit" id="md-tit"></div>
      <button class="m-x" onclick="cerrar('m-detalle')">✕</button>
    </div>
    <div class="m-body" id="md-body"></div>
    <div class="m-ftr">
      <button class="btn btn-r btn-sm" onclick="eliminarTrabajo()">Eliminar</button>
      <div style="flex:1"></div>
      <button class="btn btn-s" onclick="cerrar('m-detalle')">Cerrar</button>
      <button class="btn btn-p" onclick="editarTrabajo()">Editar</button>
    </div>
  </div>
</div>

<!-- MODAL: TRABAJADOR -->
<div class="overlay" id="m-trabajador">
  <div class="modal">
    <div class="m-hdr">
      <div class="m-tit" id="mw-tit">Agregar trabajador</div>
      <button class="m-x" onclick="cerrar('m-trabajador')">✕</button>
    </div>
    <div class="m-body">
      <div class="fg">
        <div class="fc full"><label>Nombre *</label><input id="w-nombre" placeholder="Nombre completo"></div>
        <div class="fc full"><label>Teléfono (opcional)</label><input id="w-tel" placeholder="10 dígitos"></div>
      </div>
    </div>
    <div class="m-ftr">
      <button class="btn btn-s" onclick="cerrar('m-trabajador')">Cancelar</button>
      <button class="btn btn-p" onclick="guardarTrabajador()">Guardar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const db = supabase.createClient(
  'https://ypmkuroqjhgidqpjhvtj.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlwbWt1cm9xamhnaWRxcGpodnRqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5OTk2MTcsImV4cCI6MjA5NTU3NTYxN30.4yhzqtKRlWJNMbxUyXnTonIicdh8Ose1geHI7wBQlws'
);

let trabajos=[], trabajadores=[], asigs=[], hoy=new Date();
let añoAct=hoy.getFullYear(), mesAct=hoy.getMonth();
let editId=null, editTrabId=null;

const TIPO_LBL={instalacion:'Instalación',mantenimiento:'Mantenimiento',correccion:'Corrección',bloqueo:'Bloqueo',levantamiento:'Levantamiento'};
const TIPO_CLS={instalacion:'b-inst',mantenimiento:'b-mant',correccion:'b-corr',bloqueo:'b-bloq',levantamiento:'b-lev'};
const TIPO_EV={instalacion:'ev-inst',mantenimiento:'ev-mant',correccion:'ev-corr',bloqueo:'ev-bloq',levantamiento:'ev-lev'};
const EST_LBL={pendiente:'Pendiente',en_proceso:'En proceso',completado:'Completado'};
const EST_CLS={pendiente:'b-pend',en_proceso:'b-proc',completado:'b-comp'};
const MESES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const fmt=d=>d?new Date(d+'T12:00').toLocaleDateString('es-MX',{day:'numeric',month:'short'}):'—';

function toast(m,err){
  const t=document.getElementById('toast');
  t.textContent=m; t.style.background=err?'#c0392b':'rgba(0,0,0,.85)';
  t.className='toast show'; setTimeout(()=>t.className='toast',3200);
}
function cerrar(id){document.getElementById(id).classList.remove('open')}

// ── TABS ──────────────────────────────────────────
function tab(v,el){
  ['cal','trabajos','equipo'].forEach(x=>document.getElementById('v-'+x).style.display='none');
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  document.getElementById('v-'+v).style.display='block';
  el.classList.add('on');
  if(v==='trabajos') renderTrabajos();
  if(v==='equipo') renderEquipo();
}

// ── CARGA DATOS ───────────────────────────────────
async function cargar(){
  try{
    const [a,b,c]=await Promise.all([
      db.from('trabajadores').select('*').eq('activo',true).order('nombre'),
      db.from('trabajos').select('*').order('fecha_inicio'),
      db.from('trabajos_trabajadores').select('*'),
    ]);
    if(a.error||b.error||c.error) throw(a.error||b.error||c.error);
    trabajadores=a.data||[]; trabajos=b.data||[]; asigs=c.data||[];
    document.getElementById('conn').textContent='● Conectado';
    document.getElementById('conn').className='conn ok';
    const pend=trabajos.filter(t=>t.estado==='pendiente').length;
    const cnt=document.getElementById('cnt-pend');
    if(pend>0){cnt.textContent=pend;cnt.style.display='inline'}else{cnt.style.display='none'}
    renderCalendario();
  }catch(e){
    document.getElementById('conn').textContent='● Error de conexión';
    toast('Error al cargar: '+e.message,true);
  }
}

// ── CALENDARIO ────────────────────────────────────
function mes(d){mesAct+=d;if(mesAct>11){mesAct=0;añoAct++}if(mesAct<0){mesAct=11;añoAct--}renderCalendario()}
function mesHoy(){añoAct=hoy.getFullYear();mesAct=hoy.getMonth();renderCalendario()}

function renderCalendario(){
  document.getElementById('cal-mes').textContent=MESES[mesAct]+' '+añoAct;
  const grid=document.getElementById('grid-dias');
  // mantener encabezados
  const lbls=Array.from(grid.querySelectorAll('.cal-lbl'));
  grid.innerHTML='';
  lbls.forEach(l=>grid.appendChild(l));

  const primerDia=new Date(añoAct,mesAct,1);
  const ultimoDia=new Date(añoAct,mesAct+1,0);
  // lunes=0
  let inicio=(primerDia.getDay()+6)%7;
  // días del mes anterior
  for(let i=0;i<inicio;i++){
    const d=new Date(añoAct,mesAct,1-inicio+i);
    grid.appendChild(diaEl(d,true));
  }
  for(let d=1;d<=ultimoDia.getDate();d++){
    grid.appendChild(diaEl(new Date(añoAct,mesAct,d),false));
  }
  // completar hasta múltiplo de 7
  const total=inicio+ultimoDia.getDate();
  const resto=(7-total%7)%7;
  for(let i=1;i<=resto;i++){
    grid.appendChild(diaEl(new Date(añoAct,mesAct+1,i),true));
  }
}

function diaEl(fecha,otroMes){
  const fStr=fecha.toISOString().split('T')[0];
  const esHoy=fecha.toDateString()===hoy.toDateString();
  const div=document.createElement('div');
  div.className='cal-dia'+(otroMes?' otro-mes':'')+(esHoy?' hoy':'');
  const evs=trabajos.filter(t=>fStr>=t.fecha_inicio&&fStr<=(t.fecha_fin||t.fecha_inicio));
  div.innerHTML=`<div class="dia-num">${fecha.getDate()}</div>`+
    evs.map(t=>`<div class="ev ${TIPO_EV[t.tipo]}" onclick="event.stopPropagation();verDetalle(${t.id})">${t.titulo}</div>`).join('');
  div.onclick=()=>abrirNuevo(fStr);
  return div;
}

// ── TRABAJOS LISTA ────────────────────────────────
function renderTrabajos(){
  const ft=document.getElementById('f-tipo').value;
  const fe=document.getElementById('f-estado').value;
  let data=trabajos.filter(t=>(!ft||t.tipo===ft)&&(!fe||t.estado===fe));
  data.sort((a,b)=>a.fecha_inicio.localeCompare(b.fecha_inicio));
  const el=document.getElementById('lista-trabajos');
  if(!data.length){el.innerHTML='<div class="empty">Sin trabajos con estos filtros</div>';return}
  el.innerHTML=data.map(t=>{
    const eq=asigs.filter(a=>Number(a.trabajo_id)===Number(t.id))
      .map(a=>trabajadores.find(w=>w.id===a.trabajador_id)?.nombre).filter(Boolean);
    return `<div class="card">
      <div class="card-hdr">
        <div class="card-tit">${t.titulo}</div>
        <div style="display:flex;gap:6px">
          <span class="badge ${TIPO_CLS[t.tipo]}">${TIPO_LBL[t.tipo]}</span>
          <span class="badge ${EST_CLS[t.estado]}">${EST_LBL[t.estado]}</span>
        </div>
      </div>
      <div class="card-meta">
        <span>📅 ${fmt(t.fecha_inicio)}${t.fecha_fin&&t.fecha_fin!==t.fecha_inicio?' → '+fmt(t.fecha_fin):''}</span>
        ${t.cliente_nombre?`<span>📍 ${t.cliente_nombre}</span>`:''}
        ${t.paneles?`<span>🔆 ${t.paneles}${t.panel_w?' x'+t.panel_w+'W':''} pan.${t.inversor?' · '+( t.inv_cant?t.inv_cant+'x ':'')+t.inversor:''}${t.bateria_modelo?' · '+(t.bat_cant?t.bat_cant+'x ':'')+t.bateria_modelo:''}</span>`:''}
        ${eq.length?`<span>👷 ${eq.join(', ')}</span>`:'<span style="color:var(--rojo)">Sin equipo</span>'}
      </div>
      <div class="acciones">
        <button class="btn btn-s btn-sm" onclick="verDetalle(${t.id})">Ver detalle</button>
        <button class="btn btn-s btn-sm" onclick="editarTrabajoId(${t.id})">Editar</button>
      </div>
    </div>`;
  }).join('');
}

// ── DETALLE ───────────────────────────────────────
function verDetalle(id){
  const t=trabajos.find(x=>Number(x.id)===Number(id));
  if(!t)return;
  editId=t.id;
  const eq=asigs.filter(a=>Number(a.trabajo_id)===Number(id))
    .map(a=>trabajadores.find(w=>w.id===a.trabajador_id)?.nombre).filter(Boolean);
  document.getElementById('md-tit').textContent=t.titulo;
  document.getElementById('md-body').innerHTML=`
    <div style="display:flex;gap:6px;margin-bottom:14px">
      <span class="badge ${TIPO_CLS[t.tipo]}">${TIPO_LBL[t.tipo]}</span>
      <span class="badge ${EST_CLS[t.estado]}">${EST_LBL[t.estado]}</span>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px">
      <div style="background:var(--bg);border-radius:10px;padding:12px">
        <div style="font-size:11px;font-weight:600;color:var(--suave);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">Fecha inicio</div>
        <div style="font-size:14px">${fmt(t.fecha_inicio)}</div>
      </div>
      <div style="background:var(--bg);border-radius:10px;padding:12px">
        <div style="font-size:11px;font-weight:600;color:var(--suave);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">Fecha fin</div>
        <div style="font-size:14px">${fmt(t.fecha_fin||t.fecha_inicio)}</div>
      </div>
      ${t.cliente_nombre?`<div style="background:var(--bg);border-radius:10px;padding:12px;grid-column:1/-1">
        <div style="font-size:11px;font-weight:600;color:var(--suave);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">Cliente / Ubicación</div>
        <div style="font-size:14px">${t.cliente_nombre}</div>
      </div>`:''}
      ${t.paneles?`<div style="background:var(--bg);border-radius:10px;padding:12px">
        <div style="font-size:11px;font-weight:600;color:var(--suave);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">Paneles</div>
        <div style="font-size:14px">${t.paneles} panel${t.paneles!==1?'es':''}${t.panel_w?' · '+t.panel_w+'W c/u':''}</div>
      </div>`:''}
      ${t.inversor?`<div style="background:var(--bg);border-radius:10px;padding:12px">
        <div style="font-size:11px;font-weight:600;color:var(--suave);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">Inversor</div>
        <div style="font-size:14px">${t.inv_cant?t.inv_cant+'x ':''} ${t.inversor}</div>
      </div>`:''}
      ${t.bateria_modelo?`<div style="background:var(--bg);border-radius:10px;padding:12px;grid-column:1/-1">
        <div style="font-size:11px;font-weight:600;color:var(--suave);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">Batería</div>
        <div style="font-size:14px">${t.bat_cant?t.bat_cant+'x ':''} ${t.bateria_modelo}</div>
      </div>`:''}
    </div>
    ${eq.length?`<div style="margin-bottom:12px">
      <div style="font-size:11px;font-weight:600;color:var(--suave);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px">Equipo</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px">${eq.map(n=>`<span class="pill pill-g">${n}</span>`).join('')}</div>
    </div>`:'<div style="color:var(--rojo);font-size:13px;margin-bottom:12px">⚠️ Sin equipo asignado</div>'}
    ${t.notas?`<div style="background:var(--bg);border-radius:10px;padding:12px;font-size:13px;color:var(--suave)">${t.notas}</div>`:''}`;
  document.getElementById('m-detalle').classList.add('open');
}

function editarTrabajo(){cerrar('m-detalle');editarTrabajoId(editId)}

// ── NUEVO / EDITAR TRABAJO ────────────────────────
function abrirNuevo(fecha){
  editId=null;
  document.getElementById('mt-tit').textContent='Nuevo trabajo';
  document.getElementById('mt-ftr').innerHTML=`<button class="btn btn-s" onclick="cerrar('m-trabajo')">Cancelar</button><button class="btn btn-p" onclick="guardarTrabajo()">Guardar</button>`;
  document.getElementById('t-titulo').value='';
  document.getElementById('t-tipo').value='instalacion';
  document.getElementById('t-estado').value='pendiente';
  document.getElementById('t-fi').value=fecha||'';
  document.getElementById('t-ff').value='';
  document.getElementById('t-cliente').value='';
  document.getElementById('t-paneles').value='';
  document.getElementById('t-panel-w').value='';
  document.getElementById('t-inv-cant').value='';
  document.getElementById('t-inversor').value='';
  document.getElementById('t-bat-cant').value='';
  document.getElementById('t-bateria').value='';
  document.getElementById('t-notas').value='';
  toggleTecnico();
  renderChips([]);
  document.getElementById('m-trabajo').classList.add('open');
}

function editarTrabajoId(id){
  const t=trabajos.find(x=>Number(x.id)===Number(id));
  if(!t)return;
  editId=id;
  document.getElementById('mt-tit').textContent='Editar trabajo';
  document.getElementById('mt-ftr').innerHTML=`<button class="btn btn-s" onclick="cerrar('m-trabajo')">Cancelar</button><button class="btn btn-p" onclick="guardarTrabajo()">Guardar cambios</button>`;
  document.getElementById('t-titulo').value=t.titulo||'';
  document.getElementById('t-tipo').value=t.tipo||'instalacion';
  document.getElementById('t-estado').value=t.estado||'pendiente';
  document.getElementById('t-fi').value=t.fecha_inicio||'';
  document.getElementById('t-ff').value=t.fecha_fin||'';
  document.getElementById('t-cliente').value=t.cliente_nombre||'';
  // campos técnicos — parsear si vienen como "12x550W" o guardados por separado
  document.getElementById('t-paneles').value=t.paneles||'';
  document.getElementById('t-panel-w').value=t.panel_w||'';
  document.getElementById('t-inv-cant').value=t.inv_cant||'';
  document.getElementById('t-inversor').value=t.inversor||'';
  document.getElementById('t-bat-cant').value=t.bat_cant||'';
  document.getElementById('t-bateria').value=t.bateria_modelo||'';
  document.getElementById('t-notas').value=t.notas||'';
  toggleTecnico();
  const sel=asigs.filter(a=>Number(a.trabajo_id)===Number(id)).map(a=>a.trabajador_id);
  renderChips(sel);
  document.getElementById('m-trabajo').classList.add('open');
}

function toggleTecnico(){
  const v=['instalacion','mantenimiento','correccion'].includes(document.getElementById('t-tipo').value);
  document.getElementById('bloque-tecnico').style.display=v?'flex':'none';
  document.getElementById('bloque-tecnico').style.flexDirection='column';
  document.getElementById('bloque-tecnico').style.gap='6px';
}

function renderChips(sel){
  const c=document.getElementById('chips-trab');
  c.innerHTML=trabajadores.map(w=>`<div class="chip${sel.includes(w.id)?' on':''}" onclick="toggleChip(this,${w.id})">${w.nombre}</div>`).join('');
}
function toggleChip(el){el.classList.toggle('on')}

function chipsSel(){
  return Array.from(document.querySelectorAll('#chips-trab .chip.on')).map(c=>parseInt(c.getAttribute('onclick').match(/\d+/)[0]));
}

async function guardarTrabajo(){
  const titulo=document.getElementById('t-titulo').value.trim();
  const fi=document.getElementById('t-fi').value;
  if(!titulo||!fi){toast('Título y fecha de inicio son requeridos',true);return}
  const datos={
    titulo,
    tipo:document.getElementById('t-tipo').value,
    estado:document.getElementById('t-estado').value,
    fecha_inicio:fi,
    fecha_fin:document.getElementById('t-ff').value||fi,
    cliente_nombre:document.getElementById('t-cliente').value.trim()||null,
    paneles:parseInt(document.getElementById('t-paneles').value)||null,
    panel_w:parseInt(document.getElementById('t-panel-w').value)||null,
    inv_cant:parseInt(document.getElementById('t-inv-cant').value)||null,
    inversor:document.getElementById('t-inversor').value.trim()||null,
    bat_cant:parseInt(document.getElementById('t-bat-cant').value)||null,
    bateria_modelo:document.getElementById('t-bateria').value.trim()||null,
    notas:document.getElementById('t-notas').value.trim()||null,
  };
  let tid;
  if(editId){
    const {error}=await db.from('trabajos').update(datos).eq('id',editId);
    if(error){toast('Error: '+error.message,true);return}
    tid=editId;
  }else{
    const {data,error}=await db.from('trabajos').insert(datos).select().single();
    if(error){toast('Error: '+error.message,true);return}
    tid=data.id;
  }
  // actualizar asignaciones
  await db.from('trabajos_trabajadores').delete().eq('trabajo_id',tid);
  const sel=chipsSel();
  if(sel.length){
    await db.from('trabajos_trabajadores').insert(sel.map(wid=>({trabajo_id:tid,trabajador_id:wid})));
  }
  cerrar('m-trabajo');
  toast(editId?'Trabajo actualizado':'Trabajo creado');
  await cargar();
}

async function eliminarTrabajo(){
  if(!editId)return;
  if(!confirm('¿Eliminar este trabajo?'))return;
  await db.from('trabajos_trabajadores').delete().eq('trabajo_id',editId);
  const {error}=await db.from('trabajos').delete().eq('id',editId);
  if(error){toast('Error: '+error.message,true);return}
  cerrar('m-detalle');
  toast('Trabajo eliminado');
  await cargar();
}

// ── EQUIPO ────────────────────────────────────────
function renderEquipo(){
  const el=document.getElementById('lista-equipo');
  if(!trabajadores.length){el.innerHTML='<div class="empty">Sin trabajadores registrados</div>';return}
  el.innerHTML=trabajadores.map(w=>{
    const n=asigs.filter(a=>a.trabajador_id===w.id).length;
    return `<div class="trabajador-row">
      <div class="av">${w.nombre.charAt(0).toUpperCase()}</div>
      <div class="t-info">
        <div class="t-nombre">${w.nombre}</div>
        <div class="t-rol">${n} trabajo${n!==1?'s':''} asignado${n!==1?'s':''}</div>
        ${w.telefono?`<div style="font-size:12px;color:var(--suave);margin-top:2px">📞 ${w.telefono}</div>`:''}
      </div>
      <div class="acciones">
        <button class="btn btn-s btn-sm" onclick="editarTrabajadorId(${w.id})">Editar</button>
        <button class="btn btn-r btn-sm" onclick="toggleActivo(${w.id},false)">Desactivar</button>
      </div>
    </div>`;
  }).join('');
}

function abrirNuevoTrabajador(){
  editTrabId=null;
  document.getElementById('mw-tit').textContent='Agregar trabajador';
  document.getElementById('w-nombre').value='';
  document.getElementById('w-tel').value='';
  document.getElementById('m-trabajador').classList.add('open');
}

function editarTrabajadorId(id){
  const w=trabajadores.find(x=>x.id===id);
  if(!w)return;
  editTrabId=id;
  document.getElementById('mw-tit').textContent='Editar trabajador';
  document.getElementById('w-nombre').value=w.nombre||'';
  document.getElementById('w-tel').value=w.telefono||'';
  document.getElementById('m-trabajador').classList.add('open');
}

async function guardarTrabajador(){
  const nombre=document.getElementById('w-nombre').value.trim();
  if(!nombre){toast('El nombre es requerido',true);return}
  const datos={nombre,telefono:document.getElementById('w-tel').value.trim()||null,activo:true};
  if(editTrabId){
    const {error}=await db.from('trabajadores').update(datos).eq('id',editTrabId);
    if(error){toast('Error: '+error.message,true);return}
  }else{
    const {error}=await db.from('trabajadores').insert(datos);
    if(error){toast('Error: '+error.message,true);return}
  }
  cerrar('m-trabajador');
  toast(editTrabId?'Trabajador actualizado':'Trabajador agregado');
  await cargar();
  renderEquipo();
}

async function toggleActivo(id,activo){
  if(!confirm('¿Desactivar este trabajador?'))return;
  await db.from('trabajadores').update({activo}).eq('id',id);
  toast('Trabajador desactivado');
  await cargar();
  renderEquipo();
}

cargar();
</script>
</body>
</html>
